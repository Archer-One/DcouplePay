[workspace]
members = ["program", "script"]
resolver = "2"

# SP1 precompile patches can redirect `sha2` and `k256` to Succinct's forks so
# the guest hits SHA256 and secp256k1 precompiles.  They are intentionally left
# disabled here because this environment cannot reliably fetch GitHub patch
# repositories; the crates.io versions preserve correctness but may execute
# slower inside the guest.
#
# [patch.crates-io]
# sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.8-sp1-6.0.0" }
# k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0" }
